
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data KRS</title>
    <link rel="stylesheet" href="/database_mahasiswa/static/style.css">
</head>
<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="/database_mahasiswa/">Dashboard</a>
    <a href="/database_mahasiswa/mahasiswa">Data Mahasiswa</a>
    <a href="/database_mahasiswa/prodi">Program Studi</a>
    <a href="/database_mahasiswa/dosen">Data Dosen</a>
    <a href="/database_mahasiswa/matakuliah">Mata Kuliah</a>
    <a href="/database_mahasiswa/krs" class="active">KRS</a>
    <a href="/database_mahasiswa/laporan">Laporan</a>
</div>

<div class="main-content">

    <h1>Edit Data KRS</h1>
    <p>Ubah informasi Kartu Rencana Studi mahasiswa.</p>

    <div class="form-container">

        <h2>Form Edit KRS</h2>

        <form action="/database_mahasiswa/update-krs" method="POST">

            <div class="form-group">
                <label>ID KRS</label>
                <input type="text" name="id_krs"
                       value="{{id_krs}}" readonly>
            </div>

            <div class="form-group">
                <label>NIM Mahasiswa</label>
                <input type="text" name="nim"
                       value="{{nim}}" required>
            </div>

            <div class="form-group">
                <label>ID Mata Kuliah</label>
                <input type="text" name="id_mk"
                       value="{{id_mk}}" required>
            </div>

            <div class="form-group">
                <label>Semester</label>
                <input type="number" name="semester"
                       value="{{semester}}"
                       min="1" max="14" required>
            </div>

            <div class="form-group">
                <label>Nilai Angka</label>
                <input type="number" name="nilai_angka"
                       value="{{nilai_angka}}"
                       min="0" max="100" step="0.01" required>
            </div>

            <button type="submit" class="btn-submit">
                Simpan Perubahan
            </button>

            <a href="/database_mahasiswa/krs"
               class="btn-edit">
                Kembali
            </a>

        </form>

    </div>

</div>

</body>
</html>
