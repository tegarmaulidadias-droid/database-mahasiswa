
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data KRS</title>
    <link rel="stylesheet" href="/database_mahasiswa/static/style.css">
</head>
<body>

<div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="/database_mahasiswa/">Dashboard</a>
    <a href="/database_mahasiswa/mahasiswa">Data Mahasiswa</a>
    <a href="/database_mahasiswa/prodi">Program Studi</a>
    <a href="/database_mahasiswa/dosen">Data Dosen</a>
    <a href="/database_mahasiswa/matakuliah">Mata Kuliah</a>
    <a href="/database_mahasiswa/krs" class="active">KRS</a>
    <a href="/database_mahasiswa/laporan">Laporan</a>
</div>

<div class="main-content">

    <h1>Data KRS</h1>
    <p>Kelola data Kartu Rencana Studi mahasiswa.</p>

    <div class="form-container">

        <h2>Tambah KRS</h2>

        <form action="/database_mahasiswa/tambah-krs" method="POST">

            <div class="form-group">
                <label>ID KRS</label>
                <input type="text" name="id_krs"
                       placeholder="Masukkan ID KRS" required>
            </div>

            <div class="form-group">
                <label>NIM Mahasiswa</label>
                <input type="text" name="nim"
                       placeholder="Masukkan NIM Mahasiswa" required>
            </div>

            <div class="form-group">
                <label>ID Mata Kuliah</label>
                <input type="text" name="id_mk"
                       placeholder="Masukkan ID Mata Kuliah" required>
            </div>

            <div class="form-group">
                <label>Semester</label>
                <input type="number" name="semester"
                       min="1" max="14"
                       placeholder="Contoh: 2" required>
            </div>

            <div class="form-group">
                <label>Nilai Angka</label>
                <input type="number" name="nilai_angka"
                       min="0" max="100" step="0.01"
                       placeholder="Contoh: 85" required>
            </div>

            <button type="submit" class="btn-submit">
                Tambah KRS
            </button>

        </form>

    </div>

    <div class="table-container">

        <h2>Daftar KRS Mahasiswa</h2>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>ID KRS</th>
                    <th>NIM</th>
                    <th>Nama Mahasiswa</th>
                    <th>ID Mata Kuliah</th>
                    <th>Nama Mata Kuliah</th>
                    <th>Semester</th>
                    <th>Nilai Angka</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody>
                {{data_krs}}
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
