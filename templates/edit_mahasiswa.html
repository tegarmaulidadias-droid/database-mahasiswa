<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mahasiswa</title>
    <link rel="stylesheet" href="/database_mahasiswa/static/style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Data Mahasiswa</h2>

        <a href="/database_mahasiswa/">Dashboard</a>
        <a href="/database_mahasiswa/mahasiswa" class="active">Data Mahasiswa</a>
        <a href="/database_mahasiswa/prodi">Program Studi</a>
        <a href="/database_mahasiswa/dosen">Data Dosen</a>
        <a href="/database_mahasiswa/matakuliah">Mata Kuliah</a>
        <a href="/database_mahasiswa/krs">Data KRS</a>
        <a href="/database_mahasiswa/laporan">Laporan</a>
    </div>

    <main class="content">
        <h1>Edit Data Mahasiswa</h1>
        <p>Ubah informasi mahasiswa melalui formulir berikut.</p>

        <div class="form-container">
            <h2>Form Edit Mahasiswa</h2>

            <form action="/database_mahasiswa/update" method="POST">

                <div class="form-group">
                    <label>NIM</label>
                    <input type="text" name="nim" value="{{nim}}" readonly>
                </div>

                <div class="form-group">
                    <label>Nama Mahasiswa</label>
                    <input type="text" name="nama_mahasiswa" value="{{nama_mahasiswa}}" required>
                </div>

                <div class="form-group">
                    <label>Jenis Kelamin</label>
                    <select name="jenis_kelamin" required>
                        <option value="L" {{laki_laki}}>Laki-laki</option>
                        <option value="P" {{perempuan}}>Perempuan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tanggal Lahir</label>
                    <input type="date" name="tanggal_lahir" value="{{tanggal_lahir}}" required>
                </div>

                <div class="form-group">
                    <label>Alamat</label>
                    <input type="text" name="alamat" value="{{alamat}}" required>
                </div>

                <div class="form-group">
                    <label>ID Program Studi</label>
                    <input type="number" name="id_prodi" value="{{id_prodi}}" min="1" max="10" required>
                </div>

                <button type="submit" class="btn-submit">
                    Simpan Perubahan
                </button>

                <a href="/database_mahasiswa/mahasiswa">Batal</a>

            </form>
        </div>
    </main>

</body>
</html>
