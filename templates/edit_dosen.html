
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data Dosen</title>
    <link rel="stylesheet" href="/database_mahasiswa/static/style.css">
</head>
<body>

    <div class="sidebar">
        <h2>Data Mahasiswa</h2>

        <a href="/database_mahasiswa/">Dashboard</a>
        <a href="/database_mahasiswa/mahasiswa">Data Mahasiswa</a>
        <a href="/database_mahasiswa/prodi">Program Studi</a>
        <a href="/database_mahasiswa/dosen" class="active">Data Dosen</a>
        <a href="/database_mahasiswa/matakuliah">Mata Kuliah</a>
        <a href="/database_mahasiswa/krs">Data KRS</a>
        <a href="/database_mahasiswa/laporan">Laporan</a>
    </div>

    <main class="content">
        <h1>Edit Data Dosen</h1>
        <p>Ubah informasi dosen melalui formulir berikut.</p>

        <div class="form-container">
            <h2>Form Edit Dosen</h2>

            <form action="/database_mahasiswa/update-dosen" method="POST">

                <div class="form-group">
                    <label>NIDN</label>
                    <input type="text" name="nidn" value="{{nidn}}" readonly>
                </div>

                <div class="form-group">
                    <label>Nama Dosen</label>
                    <input type="text" name="nama_dosen" value="{{nama_dosen}}" required>
                </div>

                <div class="form-group">
                    <label>Nomor Telepon</label>
                    <input type="text" name="no_telepon" value="{{no_telepon}}" required>
                </div>

                <div class="form-group">
                    <label>ID Program Studi</label>
                    <input type="number" name="id_prodi" value="{{id_prodi}}" min="1" max="10" required>
                </div>

                <button type="submit" class="btn-submit">
                    Simpan Perubahan
                </button>

                <a href="/database_mahasiswa/dosen">Batal</a>

            </form>
        </div>
    </main>

</body>
</html>
